docs: https://www.warppay402.com/
description: >-
  WarpPay402 replaces credentials with payment. There is no signup, no API key and no OAuth: an unpaid request to any
  operation receives HTTP 402 with an x402 v2 challenge, the client signs a USDC transfer for the quoted amount on one of
  four networks and retries with the signature in a PAYMENT-SIGNATURE header, and the gateway verifies settlement
  (splitting a platform fee) before proxying the request. The MCP server's discovery methods (initialize, tools/list,
  resources/list, prompts/list) are fully anonymous; tool calls are settled the same way through the stdio bridge. A
  flat-rate monthly access token is offered by email but is undocumented, so it is recorded as a claim, not a scheme.
