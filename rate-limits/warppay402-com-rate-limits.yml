description: 'No numeric rate limits are published. The provider states that rate limits exist and are enforced at the Cloudflare
  edge and by its own "x402-guard" pre-flight middleware (which stamps X-Guard-Inspected: true on responses), but publishes
  no per-key, per-wallet or per-endpoint numbers, no window, and no RateLimit-*/Retry-After headers; the exhaustion status
  is undocumented. The effective throttle is economic: each call must carry a settled USDC payment.'
