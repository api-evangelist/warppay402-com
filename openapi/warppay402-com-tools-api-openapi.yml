openapi: 3.2.0
info:
  title: WarpPay402 Monetized MCP Tools API
  description: Ultra-low-cost pay-per-use AI developer tools monetized via x402 micro-payments on Base Mainnet, Solana, Arbitrum One, and Arc Mainnet (USDC).
  version: 1.0.0
tags:
- name: Tools
paths:
  /api/v1/tools/web-scraper:
    post:
      summary: Web Scraper & Markdown Extractor
      description: Scrapes any webpage URL into clean markdown for AI agent context ($0.001 USDC).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
              required:
              - url
      responses:
        '200':
          description: Success
        '402':
          description: Payment Required
      tags:
      - Tools
      operationId: postApiV1ToolsWebScraper
      x-operation-id-source: derived
  /api/v1/tools/browser-scraper:
    post:
      summary: JavaScript Browser Scraper
      description: Executes headless Chromium browser via proxy workers ($0.005 USDC).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
              required:
              - url
      responses:
        '200':
          description: Success
        '402':
          description: Payment Required
      tags:
      - Tools
      operationId: postApiV1ToolsBrowserScraper
      x-operation-id-source: derived
  /api/v1/tools/base-analytics:
    post:
      summary: Base Wallet Analytics
      description: Fetches ETH balance and transaction count ($0.002 USDC).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                address:
                  type: string
              required:
              - address
      responses:
        '200':
          description: Success
        '402':
          description: Payment Required
      tags:
      - Tools
      operationId: postApiV1ToolsBaseAnalytics
      x-operation-id-source: derived
  /api/v1/tools/arc-analytics:
    post:
      summary: Arc Mainnet Network Analytics
      description: Fetches live block height, gas price, and RPC latency from Arc Mainnet ($0.001 USDC).
      responses:
        '200':
          description: Success
        '402':
          description: Payment Required
      tags:
      - Tools
      operationId: postApiV1ToolsArcAnalytics
      x-operation-id-source: derived
  /api/v1/tools/arc-network-query:
    post:
      summary: Arc Pre-Flight Telemetry Oracle
      description: 'Pre-flight Arc Mainnet telemetry: RPC latency (ms), gas prices (Gwei), native USDC balance, and account nonce ($0.10 USDC).'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                includeGasTrends:
                  type: boolean
                  default: true
                checkMerchantAccount:
                  type: boolean
                  default: true
      responses:
        '200':
          description: Success
        '402':
          description: Payment Required - x402 $0.10 USDC micropayment challenge
      tags:
      - Tools
      operationId: postApiV1ToolsArcNetworkQuery
      x-operation-id-source: derived
  /api/v1/tools/pdf-extractor:
    post:
      summary: PDF Document Extractor
      description: Downloads and extracts text from public PDF URL ($0.005 USDC).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pdfUrl:
                  type: string
              required:
              - pdfUrl
      responses:
        '200':
          description: Success
        '402':
          description: Payment Required
      tags:
      - Tools
      operationId: postApiV1ToolsPdfExtractor
      x-operation-id-source: derived
  /api/v1/tools/render-screenshot:
    post:
      summary: Full-Page Render & Screenshot
      description: Captures full-page rendered screenshot image data ($0.01 USDC).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
              required:
              - url
      responses:
        '200':
          description: Success
        '402':
          description: Payment Required
      tags:
      - Tools
      operationId: postApiV1ToolsRenderScreenshot
      x-operation-id-source: derived
  /api/v1/tools/extract-json:
    post:
      summary: Structured Data Extractor
      description: Extracts structured JSON data from web pages ($0.01 USDC).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                schema:
                  type: object
              required:
              - url
      responses:
        '200':
          description: Success
        '402':
          description: Payment Required
      tags:
      - Tools
      operationId: postApiV1ToolsExtractJson
      x-operation-id-source: derived
  /api/v1/tools/smart-contract-verifier:
    post:
      summary: Base Smart Contract Verifier
      description: Source code analysis, ABI fetching, and proxy validation ($0.02 USDC).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                address:
                  type: string
              required:
              - address
      responses:
        '200':
          description: Success
        '402':
          description: Payment Required
      tags:
      - Tools
      operationId: postApiV1ToolsSmartContractVerifier
      x-operation-id-source: derived
  /api/v1/tools/aerodrome-yields:
    get:
      summary: Aerodrome DEX Yield Optimizer
      description: Fetches top live Aerodrome DEX yield pools, APYs, and TVL on Base Mainnet ($0.003 USDC).
      responses:
        '200':
          description: Success
        '402':
          description: Payment Required
      tags:
      - Tools
      operationId: getApiV1ToolsAerodromeYields
      x-operation-id-source: derived
  /api/v1/tools/aerodrome-swap:
    post:
      summary: Aerodrome DEX Swap Execution Engine
      description: Executes token swaps via Aerodrome vAMM/sAMM routes on Base Mainnet ($0.01 USDC).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tokenIn:
                  type: string
                tokenOut:
                  type: string
                amountIn:
                  type: string
                decimalsIn:
                  type: number
                isStable:
                  type: boolean
              required:
              - tokenIn
              - tokenOut
              - amountIn
              - decimalsIn
              - isStable
      responses:
        '200':
          description: Success
        '402':
          description: Payment Required
      tags:
      - Tools
      operationId: postApiV1ToolsAerodromeSwap
      x-operation-id-source: derived
  /api/v1/tools/aerodrome-clamm:
    post:
      summary: Aerodrome Slipstream CLAMM LP Route
      description: Allows agents to open, adjust, and rebalance concentrated liquidity ranges ($0.01 USDC).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum:
                  - mint
                  - increaseLiquidity
                  - decreaseLiquidity
                  - collect
                token0:
                  type: string
                token1:
                  type: string
                tickLower:
                  type: number
                tickUpper:
                  type: number
                amount0Desired:
                  type: string
                amount1Desired:
                  type: string
                tokenId:
                  type: string
              required:
              - action
      responses:
        '200':
          description: Success
        '402':
          description: Payment Required
      tags:
      - Tools
      operationId: postApiV1ToolsAerodromeClamm
      x-operation-id-source: derived
  /api/v1/tools/aerodrome-veaero:
    post:
      summary: Aerodrome veAERO Lock & Vote Route
      description: Automates $AERO locking, epoch gauge voting, and bribe reward harvesting ($0.01 USDC).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum:
                  - createLock
                  - increaseAmount
                  - increaseUnlockTime
                  - vote
                  - claimBribes
                amount:
                  type: string
                lockDurationWeeks:
                  type: number
                tokenId:
                  type: string
                poolVoteAddresses:
                  type: array
                  items:
                    type: string
              required:
              - action
      responses:
        '200':
          description: Success
        '402':
          description: Payment Required
      tags:
      - Tools
      operationId: postApiV1ToolsAerodromeVeaero
      x-operation-id-source: derived
  /api/v1/tools/deploy-contract:
    post:
      summary: Smart Contract Deployment Factory
      description: Programmatically deploys custom Escrow, Bounty, or Agent contracts directly to Base Mainnet ($5.00 USDC).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                contractType:
                  type: string
                  enum:
                  - escrow
                  - bounty
                  - subscription
                  - pendle
              required:
              - contractType
      responses:
        '200':
          description: Success
        '402':
          description: Payment Required
      tags:
      - Tools
      operationId: postApiV1ToolsDeployContract
      x-operation-id-source: derived
  /api/v1/tools/deploy-solana-contract:
    post:
      summary: Solana Contract Deployment Factory
      description: Programmatically initializes SPL Escrows, cNFT Badge Issuers, or Raydium Vaults on Solana Mainnet ($5.00 USDC).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                contractType:
                  type: string
                  enum:
                  - spl_escrow
                  - cnft_badge
                  - raydium_vault
                params:
                  type: object
              required:
              - contractType
      responses:
        '200':
          description: Success
        '402':
          description: Payment Required
      tags:
      - Tools
      operationId: postApiV1ToolsDeploySolanaContract
      x-operation-id-source: derived
  /api/v1/tools/deploy-arc-contract:
    post:
      summary: Arc Smart Contract Factory
      description: Programmatically deploys custom Escrow, Bounty, or Agent smart contracts directly to Arc Mainnet ($5.00 USDC).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                contractType:
                  type: string
                  enum:
                  - escrow
                  - bounty
                  - subscription
              required:
              - contractType
      responses:
        '200':
          description: Success
        '402':
          description: Payment Required
      tags:
      - Tools
      operationId: postApiV1ToolsDeployArcContract
      x-operation-id-source: derived
  /api/v1/tools/arc-cctp-bridge:
    post:
      summary: Arc Circle CCTP Bridge Engine
      description: Bridges USDC cross-chain from Arc Mainnet via Circle CCTP ($0.25 USDC).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amountUsdc:
                  type: string
                destinationChain:
                  type: string
                  enum:
                  - ethereum
                  - avalanche
                  - optimism
                  - arbitrum
                  - solana
                  - base
                recipientAddress:
                  type: string
              required:
              - amountUsdc
              - destinationChain
              - recipientAddress
      responses:
        '200':
          description: Success
        '402':
          description: Payment Required
      tags:
      - Tools
      operationId: postApiV1ToolsArcCctpBridge
      x-operation-id-source: derived
