source: >-
  Live responses from https://api.warppay402.com on 2026-09-19 (HTTP 402 challenges on POST /api/v1/tools/web-scraper,
  GET /api/v1/feeds/base-yields and GET /public_data_feed/index.json; JSON-RPC initialize/tools/list on /mcp;
  /.well-known/agent.json), the provider's OpenAPI at /openapi.json, and the @warppay402/server README (x402 V2
  compliance claims). No marketing compliance page exists; the site is four Google Sites pages.
description: >-
  Standards the WarpPay402 surface actually conforms to, judged from what the host serves. This is a payments-for-agents
  provider whose whole access model is the x402 protocol, so the domain-standard signature lives in the 402 response
  itself rather than in the OpenAPI, which declares no securitySchemes.
domain_standard:
  id: x402
  version: 2
  conforms: true
  role: resource server (merchant) — every metered operation issues the challenge and verifies the settlement
  evidence:
  - url: https://api.warppay402.com/api/v1/tools/web-scraper
    observed: >-
      POST without payment -> HTTP 402; response header PAYMENT-REQUIRED (base64 JSON) and body {"error":"Payment required",
      "x402Version":2,"resource":{url,description,mimeType},"accepts":[{scheme:"exact",network:"eip155:8453",asset:<Base USDC>,
      amount:"1000",maxTimeoutSeconds:300,payTo},...solana, eip155:42161, eip155:5042],"extensions":{"bazaar":{schemaVersion "2.0",
      JSON Schema 2020-12 input schema, info.input/output}}}; Access-Control-Expose-Headers: PAYMENT-REQUIRED, PAYMENT-RESPONSE;
      X-Guard-Inspected: true.
  - url: https://api.warppay402.com/.well-known/x402-manifest.json
    observed: HTTP 200, 19 endpoints with method + costUSD, paymentNetwork eip155:8453, acceptedAsset Base USDC.
  - url: openapi/warppay402-com-openapi.yml
    observed: every operation declares a 402 response ("Payment Required - x402 USDC micropayment challenge").
  note: >-
    x402 is the de-facto standard for HTTP-native agent micropayments (Coinbase-originated, open spec). It is not yet a
    scored standard in scoring.yml (memory x402-adoption-measured: measure, do not score) — recorded here as evidence,
    with the challenge observed on the documented operation path rather than the base URL.
