description: 'WarpPay402 operates a hosted MCP server at https://api.warppay402.com/mcp. It answers Streamable-HTTP JSON-RPC
  POSTs directly (200 application/json) and also the legacy HTTP+SSE transport (GET /mcp opens an event stream whose first
  event names a per-session /messages?sessionId=... endpoint; ?v=1 and ?v=2 serve the same 19 tools). initialize reports protocolVersion
  2024-11-05, serverInfo "WarpPay402 Backend" 1.0.0 and capabilities tools/resources/prompts; resources/list and prompts/list
  are empty. tools/list is anonymous and returns 19 tools with inputSchema. Tool invocation is metered per call in USDC through
  the x402 protocol rather than an API key: the REST endpoint behind each tool answers HTTP 402 with a PAYMENT-REQUIRED challenge
  until a PAYMENT-SIGNATURE is presented, and the provider ships @warppay402/mcp-client, a stdio-to-SSE bridge that signs
  those challenges with a CUSTOMER_PRIVATE_KEY so Cursor, Windsurf and Claude Desktop can use the tools. An unauthenticated
  tools/call from this crawler returned 200 with an empty result object rather than a 402, so the payment negotiation for
  the MCP path is observed only through the bridge.'
