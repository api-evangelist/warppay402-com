specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: WarpPay402 Studio
providerId: warppay402-com
created: '2026-09-19'
modified: '2026-09-19'
generated: '2026-09-19'
method: probed
source: https://api.warppay402.com/.well-known/x402-manifest.json (machine-readable, fetched 2026-09-19); cross-checked against
  https://api.warppay402.com/agent-offers.json, the MCP tools/list descriptions, the live 402 amount on three operations,
  and the homepage https://www.warppay402.com/
sources:
- https://api.warppay402.com/.well-known/x402-manifest.json
- https://api.warppay402.com/agent-offers.json
- https://www.warppay402.com/
tags:
- x402
- Micropayments
- Pay-per-use
- USDC
description: 'WarpPay402 has no tiers, subscriptions or free quota: every call is priced individually in USDC and paid in-band
  through an x402 challenge (no account, no key). Prices run from $0.0001 (attestation feed) to $5.00 (contract deployment
  factories). The homepage also offers "traditional API access tokens ... at a flat rate per month" on request by email, with
  no published price. Note the discrepancy recorded per entry: the homepage quotes prices roughly 10x higher than the served
  manifest for eight tools; the live 402 challenges match the manifest (1000 base units = $0.001 for web-scraper and the feeds),
  so the manifest is treated as current.'
plan_count: 1
plans:
- id: warppay402-pay-per-call
  name: Pay-per-call (x402)
  type: usage-based
  price: per call, see entries
  currency: USDC
  billing_period: per request, settled on-chain before the response
  included_quota: none
  overage: not applicable
  free_tier: false
  signup_required: false
  settlement_networks:
  - eip155:8453 Base (USDC 0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913)
  - solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp (SPL USDC EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v)
  - eip155:42161 Arbitrum One (USDC 0xaf88d065e77c8cC2239327C5EDb3A432268e5831)
  - eip155:5042 Arc (native USDC)
  limits: undocumented (Cloudflare edge rate limiting only) — see rate-limits/
  entries:
  - label: Public attestation data feed JSON records
    name: filename
    type: metered
    metric: call
    method: GET
    path: /public_data_feed/{filename}
    unit: 1
    price: 0.0001 USDC
    currency: USDC
    price_usd: 0.0001
  - label: Pre-scraped AI market data feeds and yield reports
    name: feedId
    type: metered
    metric: call
    method: GET
    path: /api/v1/feeds/{feedId}
    unit: 1
    price: 0.001 USDC
    currency: USDC
    price_usd: 0.001
    homepage_price: 0.05 USDC
    note: Homepage marketing copy (and the older SKILL.md / SDK README) still states the higher price; the machine-readable
      manifest, agent-offers.json and MCP tool descriptions agree on the lower one.
  - label: Scrapes web pages into clean Markdown for AI context
    name: web-scraper
    type: metered
    metric: call
    method: POST
    path: /api/v1/tools/web-scraper
    unit: 1
    price: 0.001 USDC
    currency: USDC
    price_usd: 0.001
    homepage_price: 0.01 USDC
