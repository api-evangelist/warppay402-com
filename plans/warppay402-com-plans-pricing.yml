self_serve_gateway:
  note: For developers monetizing their own APIs through the WarpPay402 Self-Serve Gateway the homepage states a 95% payout
    of every call fee (a 5% platform fee), paid in USDC to the developer wallet; @warppay402/server exposes this as platformFeeBps.
