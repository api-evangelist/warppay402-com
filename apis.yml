aid: warppay402-com
name: WarpPay402 Studio
description: 'WarpPay402 Studio operates WarpPay402, a non-custodial x402 monetization gateway and hosted MCP tool
  suite for autonomous AI agents. Nineteen pay-per-use tools — Markdown and headless-browser web scraping, PDF text
  extraction, full-page screenshots, schema-driven JSON extraction, Base and Arc network analytics, Basescan contract
  verification, Aerodrome yield, swap, concentrated-liquidity and veAERO routes, contract deployment factories for
  Base, Solana and Arc, and Circle CCTP bridging — are exposed three ways from one host: a REST API described by
  an OpenAPI 3.1 document at api.warppay402.com/openapi.json, a hosted MCP server at api.warppay402.com/mcp (Streamable
  HTTP and legacy SSE, 19 tools listed anonymously), and an agent card at /.well-known/agent.json. There are no
  API keys: every call answers HTTP 402 with an x402 v2 PAYMENT-REQUIRED challenge and settles in USDC on Base,
  Solana, Arbitrum One or Arc (prices from $0.0001 to $5.00 per call), with flat-rate access tokens offered by email.
  The company also publishes @warppay402/server, the x402 middleware its Self-Serve Gateway is built on, so other
  developers can wrap their own APIs and MCP tools in the same 402 challenge, and @warppay402/sdk plus a stdio MCP
  bridge for Cursor, Windsurf and Claude Desktop. The site is a Google Sites page; all documentation lives on it
  and in the npm READMEs.'
