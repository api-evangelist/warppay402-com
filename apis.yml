- name: WarpPay402 MCP Server
  description: Hosted MCP server at https://api.warppay402.com/mcp exposing the same 19 tools as the REST API (public_data_feed,
    data_feeds, web_scraper, browser_scraper, base_analytics, arc_analytics, arc_network_oracle_query, pdf_extractor,
    render_screenshot, extract_json, smart_contract_verifier, get_aerodrome_yields, aerodrome_swap, aerodrome_clamm,
    aerodrome_veaero, deploy_contract, deploy_solana_contract, deploy_arc_contract, arc_cctp_bridge). Answers Streamable-HTTP
    JSON-RPC directly and the legacy HTTP+SSE transport; initialize reports protocolVersion 2024-11-05, serverInfo
    "WarpPay402 Backend" 1.0.0; resources and prompts are empty. tools/list is anonymous; calls are settled per
    invocation by x402 USDC micropayment, which the provider's @warppay402/mcp-client stdio bridge signs from a
    CUSTOMER_PRIVATE_KEY for Cursor, Windsurf and Claude Desktop. Discovery manifest at /.well-known/mcp.json.
