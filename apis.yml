apis:
- name: WarpPay402 Monetized MCP Tools API
  description: 'REST surface of the WarpPay402 gateway at https://api.warppay402.com: 19 operations (2 GET feeds,
    1 GET yield read, 16 POST tools) covering web, browser, PDF and screenshot extraction, structured JSON extraction,
    Base/Arc analytics, Basescan contract verification, Aerodrome DeFi routes, Base/Solana/Arc contract deployment
    and CCTP bridging. Described by an OpenAPI 3.1.0 document the provider serves at /openapi.json (no securitySchemes,
    no component schemas, no operationIds in the original). Every operation is metered by the x402 protocol: an
    unpaid request returns HTTP 402 with a PAYMENT-REQUIRED header and JSON body listing accepted networks (eip155:8453,
    solana mainnet, eip155:42161, eip155:5042), asset, amount and payTo; the client signs and retries with PAYMENT-SIGNATURE.
    Prices are published machine-readably at /.well-known/x402-manifest.json and /agent-offers.json.'
