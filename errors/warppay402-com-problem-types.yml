  code: not_found
  media_type: text/plain
  applies_to: >-
    Declared on GET /public_data_feed/{filename} and GET /api/v1/feeds/{feedId} ("File not found"); observed for any
    unknown route (/docs, /swagger.json, /.well-known/oauth-protected-resource, /api/v1/paymaster/quote).
  body: '404 Not Found'
  remediation: Check the filename / feedId against the provider's published feeds; unknown gateway routes 404 rather than redirect.
- status: 200
  title: Success (tool-level failure inside a 200)
  code: null
  note: >-
    The spec documents no 4xx other than 402/404 and no 5xx. Tool-level failures (unreachable target URL, invalid address,
